llm:
  provider: "groq"
  available_providers: ["groq", "ollama"]
  groq:
    model: "openai/gpt-oss-120b"
    api_key: "${GROQ_API_KEY}"
  ollama:
    model: "llama3.2"
    base_url: "http://localhost:11434"

embeddings:
  model: "all-MiniLM-L6-v2"
  chroma_path: "./chroma_data"
  collection: "master_resume_chunks"
  n_results: 5
